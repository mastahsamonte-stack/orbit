<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1280"/>
<title>Orbit · Creative finance lead network</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet"/>
<style>
/* Assisted Living Orbit — design tokens & base */
:root {
  --accent: #2f5fe0;
  --accent-deep: #1f3f99;
  --accent-soft: #eaf0ff;
  --planet: #2f7d4a;
  --planet-soft: #e7f3ec;
  --orbiter: #b04a2a;
  --orbiter-soft: #f7ece6;
  --moon: #5b7b9e;
  --moon-soft: #e8f0f8;

  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #faf8f3;
  --line: #e8e4d9;
  --line-strong: #d2cdbf;

  --ink: #1a1a17;
  --ink-2: #4b4a45;
  --ink-3: #7a7870;
  --ink-4: #a8a59c;

  --warn: #b8742d;
  --warn-soft: #fbf2e3;
  --danger: #b03a3a;
  --danger-soft: #fbe9e9;
  --success: #2f7d4a;
  --success-soft: #e7f3ec;

  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;

  --shadow-sm: 0 1px 2px rgba(20, 18, 14, 0.04), 0 1px 1px rgba(20, 18, 14, 0.03);
  --shadow: 0 2px 4px rgba(20, 18, 14, 0.04), 0 8px 24px -12px rgba(20, 18, 14, 0.10);
  --shadow-lg: 0 4px 8px rgba(20, 18, 14, 0.06), 0 24px 48px -16px rgba(20, 18, 14, 0.16);

  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-serif: "Fraunces", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --density-row: 52px;
}

* { box-sizing: border-box; }

html, body, #root {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button { font: inherit; color: inherit; cursor: pointer; }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #d8d4c7; border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #c2bdac; }

/* App layout */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  background: var(--surface-2);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 18px 12px;
  gap: 6px;
  overflow-y: auto;
}

.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px 16px;
}
.brand-mark {
  width: 28px; height: 28px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff 0%, var(--accent) 60%, var(--accent-deep) 100%);
  position: relative;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
}
.brand-mark::after {
  content: ""; position: absolute; inset: -6px;
  border: 1px solid var(--ink-4); border-radius: 50%;
  transform: rotate(-22deg) scaleY(0.45);
  opacity: 0.55;
}
.brand-name {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.01em;
}

.role-switch {
  margin: 0 6px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 3px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 2px;
  font-size: 11px;
  font-weight: 600;
}
.role-switch button {
  background: transparent; border: 0; padding: 6px 10px;
  border-radius: 999px;
  color: var(--ink-3);
  letter-spacing: 0.02em;
  transition: background 120ms, color 120ms;
}
.role-switch button.active.orbiter {
  background: var(--orbiter); color: #fff;
}
.role-switch button.active.planet {
  background: var(--planet); color: #fff;
}
.role-switch button.active.moon {
  background: var(--moon); color: #fff;
}

.nav-section {
  display: flex; flex-direction: column; gap: 1px;
  padding: 6px 0;
}
.nav-label {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-4);
  padding: 8px 10px 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 8px;
  color: var(--ink-2); font-weight: 500; font-size: 13px;
  background: transparent; border: 0; text-align: left;
  width: 100%;
}
.nav-item:hover { background: rgba(0,0,0,0.04); color: var(--ink); }
.nav-item.active { background: var(--ink); color: #fff; }
.nav-item.active .nav-icon { color: #fff; }
.nav-icon { width: 16px; height: 16px; color: var(--ink-3); flex: 0 0 16px; }
.nav-count {
  margin-left: auto; font-size: 11px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--line);
  padding: 1px 7px; border-radius: 999px; color: var(--ink-3);
}
.nav-item.active .nav-count { background: rgba(255,255,255,0.18); border-color: transparent; color: #fff; }

.sidebar-footer {
  margin-top: auto;
  padding: 10px;
  display: flex; align-items: center; gap: 10px;
  border-top: 1px solid var(--line);
}
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 600; font-size: 12px; color: #fff;
  background: var(--ink); flex: 0 0 32px;
}
.avatar.orbiter { background: var(--orbiter); }
.avatar.planet { background: var(--planet); }
.avatar.moon { background: var(--moon); }
.avatar.sm { width: 24px; height: 24px; font-size: 10px; }
.avatar.lg { width: 44px; height: 44px; font-size: 14px; }

.user-meta { display: flex; flex-direction: column; line-height: 1.2; }
.user-meta .name { font-size: 13px; font-weight: 600; }
.user-meta .role { font-size: 11px; color: var(--ink-3); }

/* Main */
.main {
  display: flex; flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

.topbar {
  height: 56px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  display: flex; align-items: center;
  padding: 0 24px; gap: 16px;
}
.crumb {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--ink-3);
}
.crumb .here { color: var(--ink); font-weight: 600; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 10px;
  width: 280px;
  color: var(--ink-3);
  font-size: 13px;
}
.search input {
  background: transparent; border: 0; outline: 0; flex: 1;
  font: inherit; color: var(--ink);
}

.icon-btn {
  width: 34px; height: 34px; border-radius: 8px;
  display: grid; place-items: center;
  background: transparent; border: 1px solid var(--line);
  color: var(--ink-2);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

.content {
  flex: 1; overflow-y: auto;
  padding: 28px 32px 80px;
}

/* Typography */
.h1 { font-family: var(--font-serif); font-weight: 500; font-size: 28px; letter-spacing: -0.015em; line-height: 1.15; margin: 0; }
.h2 { font-family: var(--font-serif); font-weight: 500; font-size: 20px; letter-spacing: -0.01em; line-height: 1.2; margin: 0; }
.h3 { font-weight: 600; font-size: 14px; letter-spacing: 0; margin: 0; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.mono { font-family: var(--font-mono); }

/* Page header */
.page-head {
  display: flex; align-items: flex-end; gap: 24px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 22px;
}
.page-head .meta { display: flex; flex-direction: column; gap: 6px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px; font-weight: 500;
  transition: background 120ms, border-color 120ms, transform 80ms;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #000; }
.btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.accent:hover { background: var(--accent-deep); }
.btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger-soft); }
.btn.success { background: var(--success); color: #fff; border-color: var(--success); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: rgba(0,0,0,0.04); }
.btn.lg { padding: 10px 18px; font-size: 14px; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* Inputs */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 11px; color: var(--ink-3); }
.input, .select, .textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 12px;
  font: inherit; color: var(--ink);
  outline: none;
  transition: border-color 120ms, box-shadow 120ms;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input.with-prefix { padding-left: 28px; }
.input-wrap { position: relative; }
.input-wrap .prefix {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--ink-3); font-size: 13px;
}
.textarea { min-height: 96px; resize: vertical; line-height: 1.5; }

.checkbox, .radio {
  width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid var(--line-strong);
  background: var(--surface); display: inline-grid; place-items: center;
  flex: 0 0 16px; transition: background 120ms, border-color 120ms;
}
.radio { border-radius: 50%; }
.checkbox.checked, .radio.checked {
  background: var(--ink); border-color: var(--ink);
  color: #fff;
}
.checkbox.checked::after { content: "✓"; font-size: 11px; line-height: 1; }
.radio.checked::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }

.option-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--surface);
  cursor: pointer; user-select: none;
}
.option-row:hover { border-color: var(--line-strong); }
.option-row.active { border-color: var(--ink); background: var(--surface-2); }

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.card.flat { box-shadow: none; }
.card-pad { padding: 18px; }
.card-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.card-body { padding: 18px; }
.card-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line);
  letter-spacing: 0.01em;
  white-space: nowrap;
}
.badge.dot::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
}
.badge.success { background: var(--success-soft); color: var(--success); border-color: transparent; }
.badge.warn    { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.danger  { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.badge.accent  { background: var(--accent-soft); color: var(--accent-deep); border-color: transparent; }
.badge.neutral { background: #efece4; color: var(--ink-2); border-color: transparent; }
.badge.outline { background: transparent; }

/* Tables */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: left; font-weight: 600; font-size: 11px;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-3); padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
  position: sticky; top: 0;
}
.table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.table tr:hover td { background: var(--surface-2); }
.table tr.clickable { cursor: pointer; }

/* Filters / chips */
.chiprow { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 12px; color: var(--ink-2);
  cursor: pointer;
}
.chip:hover { border-color: var(--line-strong); }
.chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

/* Stats */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.stat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.stat .lab { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.stat .val { font-family: var(--font-serif); font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
.stat .delta { font-size: 11px; color: var(--ink-3); }
.stat .delta.up { color: var(--success); }
.stat .delta.down { color: var(--danger); }

/* Avatar/group */
.avatar-group { display: inline-flex; }
.avatar-group .avatar { border: 2px solid var(--surface); margin-left: -8px; }
.avatar-group .avatar:first-child { margin-left: 0; }

/* Two-pane */
.two-pane {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 380px;
  gap: 18px;
}
.three-pane {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr) 360px;
  gap: 18px;
  height: calc(100vh - 56px - 28px - 80px);
  min-height: 600px;
}

/* Pipeline kanban */
.kanban {
  display: grid;
  grid-template-columns: repeat(5, minmax(220px, 1fr));
  gap: 14px;
}
.kanban-col {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  display: flex; flex-direction: column;
  min-height: 400px;
}
.kanban-head {
  padding: 12px 14px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--line);
}
.kanban-head .title { font-weight: 600; font-size: 13px; }
.kanban-head .count {
  margin-left: auto;
  font-size: 11px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--line);
  padding: 1px 7px; border-radius: 999px; color: var(--ink-3);
}
.kanban-list {
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px; overflow-y: auto;
}
.kanban-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
  cursor: pointer; transition: border-color 120ms, transform 80ms;
}
.kanban-card:hover { border-color: var(--line-strong); transform: translateY(-1px); }

/* Buy Box card */
.bb-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: border-color 120ms, transform 100ms, box-shadow 120ms;
}
.bb-card:hover {
  border-color: var(--line-strong);
  box-shadow: var(--shadow);
}
.bb-banner {
  height: 90px;
  background: linear-gradient(135deg, var(--accent-soft) 0%, #f3edff 60%, #ffe8d6 100%);
  position: relative;
  border-bottom: 1px solid var(--line);
}
.bb-banner.alt-1 { background: linear-gradient(135deg, #e9f4ec 0%, #eaf3ff 100%); }
.bb-banner.alt-2 { background: linear-gradient(135deg, #fef0e1 0%, #f3eaff 100%); }
.bb-banner.alt-3 { background: linear-gradient(135deg, #ffeae0 0%, #f3f8ed 100%); }
.bb-banner.alt-4 { background: linear-gradient(135deg, #e3eff1 0%, #fbf0e5 100%); }
.bb-banner .planet-mark {
  position: absolute; bottom: -22px; left: 18px;
  width: 48px; height: 48px; border-radius: 50%;
  border: 3px solid var(--surface);
  background: radial-gradient(circle at 30% 30%, #fff 0%, var(--planet) 70%);
}
.bb-card-body { padding: 28px 18px 14px; display: flex; flex-direction: column; gap: 10px; }
.bb-card .name { font-family: var(--font-serif); font-size: 18px; font-weight: 500; }
.bb-card .where { font-size: 12px; color: var(--ink-3); }
.bb-criteria { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
.bb-crit-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.bb-crit-row .lab { color: var(--ink-3); width: 70px; flex: 0 0 70px; }
.bb-crit-row .val { color: var(--ink); font-weight: 500; }
.bb-foot {
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
  background: var(--surface-2);
}
.bb-foot .stat-mini { display: flex; flex-direction: column; line-height: 1.1; }
.bb-foot .stat-mini .v { font-weight: 600; font-size: 13px; }
.bb-foot .stat-mini .l { font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }

/* Wizard / stepper */
.stepper { display: flex; align-items: center; gap: 0; padding: 8px 0; }
.step { display: flex; align-items: center; gap: 10px; flex: 1; }
.step .num {
  width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 600;
  background: var(--surface); border: 1.5px solid var(--line-strong);
  color: var(--ink-3);
}
.step.done .num { background: var(--success); color: #fff; border-color: var(--success); }
.step.active .num { background: var(--ink); color: #fff; border-color: var(--ink); }
.step .lab { font-size: 12px; color: var(--ink-3); }
.step.active .lab { color: var(--ink); font-weight: 600; }
.step .bar { flex: 1; height: 1.5px; background: var(--line); }
.step.done .bar { background: var(--success); }

/* Inbox row */
.inbox-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
  transition: border-color 120ms, background 120ms;
}
.inbox-row:hover { background: var(--surface-2); border-color: var(--line-strong); }
.inbox-row.active { border-color: var(--ink); background: var(--surface-2); }
.inbox-row.unread { border-left: 3px solid var(--accent); }

/* Messaging */
.msg-thread {
  display: flex; flex-direction: column; gap: 12px;
  padding: 18px;
  overflow-y: auto;
}
.msg {
  max-width: 70%;
  padding: 9px 12px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.45;
  white-space: pre-wrap;
}
.msg.them {
  align-self: flex-start;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
}
.msg.me {
  align-self: flex-end;
  background: var(--ink);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg-meta { font-size: 10px; color: var(--ink-4); margin-top: 4px; }

/* Property image placeholder */
.img-placeholder {
  background: repeating-linear-gradient(135deg, #efece4 0 8px, #e8e4d9 8px 16px);
  border-radius: var(--radius);
  display: grid; place-items: center;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.05em;
}

/* Diff/comparison rows */
.kv-grid {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 6px 18px;
  font-size: 13px;
}
.kv-grid .k { color: var(--ink-3); padding-top: 1px; }
.kv-grid .v { color: var(--ink); }

/* Drawer */
.drawer-back {
  position: fixed; inset: 0;
  background: rgba(20, 18, 14, 0.35);
  backdrop-filter: blur(2px);
  z-index: 30;
}
.drawer {
  position: fixed; right: 0; top: 0; bottom: 0;
  width: min(640px, 100vw);
  background: var(--surface);
  border-left: 1px solid var(--line);
  z-index: 31;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
}
.drawer-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
}
.drawer-body { flex: 1; overflow-y: auto; padding: 18px; }
.drawer-foot {
  padding: 14px 18px;
  border-top: 1px solid var(--line);
  display: flex; gap: 8px;
  background: var(--surface-2);
}

/* Toggle */
.toggle {
  width: 30px; height: 18px; border-radius: 999px;
  background: var(--line-strong); position: relative;
  transition: background 120ms;
  cursor: pointer; flex: 0 0 30px;
}
.toggle::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff;
  transition: left 120ms;
}
.toggle.on { background: var(--ink); }
.toggle.on::after { left: 14px; }

/* Misc utility */
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.spacer { flex: 1; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }
.divider.vert { width: 1px; height: 100%; background: var(--line); margin: 0 14px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

/* Map placeholder */
.map {
  background:
    radial-gradient(circle at 22% 35%, #d3e4f5 0 4px, transparent 4px),
    radial-gradient(circle at 60% 60%, #d3e4f5 0 4px, transparent 4px),
    radial-gradient(circle at 75% 28%, #d3e4f5 0 4px, transparent 4px),
    radial-gradient(circle at 35% 70%, #d3e4f5 0 4px, transparent 4px),
    linear-gradient(135deg, #eef3f6 0%, #f5f1ea 100%);
  background-size: cover;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  position: relative;
  overflow: hidden;
}
.map::before {
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.pin {
  position: absolute;
  width: 28px; height: 28px;
  display: grid; place-items: center;
  background: var(--ink); color: #fff;
  border-radius: 50% 50% 50% 0;
  transform: translate(-50%, -100%) rotate(-45deg);
  font-size: 10px; font-weight: 700;
}
.pin > span { transform: rotate(45deg); }

/* Empty state */
.empty {
  border: 1.5px dashed var(--line-strong);
  border-radius: var(--radius);
  padding: 36px;
  text-align: center;
  color: var(--ink-3);
  background: var(--surface-2);
}

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tab {
  padding: 8px 14px;
  font-size: 13px; font-weight: 500;
  color: var(--ink-3);
  background: transparent; border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }

/* Term suggestion (creative finance) */
.term-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
  background: var(--surface);
  display: flex; flex-direction: column; gap: 6px;
  cursor: pointer;
  transition: border-color 120ms, background 120ms;
}
.term-card:hover { border-color: var(--line-strong); }
.term-card.active { border-color: var(--ink); background: var(--surface-2); }
.term-card .label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.term-card .name { font-family: var(--font-serif); font-size: 16px; font-weight: 500; }
.term-card .desc { font-size: 12px; color: var(--ink-2); line-height: 1.4; }

/* Splash dot pulse */
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.2); opacity: 0.6; }
}
.pulse-dot {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; background: var(--success);
  animation: pulse 1.6s ease-in-out infinite;
}

/* JV pie/split */
.split-bar {
  display: flex; height: 12px; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--line);
}
.split-bar .a { background: var(--orbiter); }
.split-bar .b { background: var(--planet); }

/* Loader for messaging composer */
.composer {
  border-top: 1px solid var(--line);
  padding: 12px 14px;
  background: var(--surface);
  display: flex; align-items: end; gap: 8px;
}
.composer textarea {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
  font: inherit; resize: none; min-height: 40px; max-height: 120px;
  outline: none;
}
.composer textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

</style>

<script type="text/babel">// Shared components used across screens
const { useState, useEffect, useMemo, useRef } = React;
const { Icon } = window;
const { STATUSES } = window.ORBIT_DATA;

const Money = ({ value, compact = false }) => {
  if (!value) return <span>—</span>;
  const opts = compact && value >= 1000
    ? { notation: "compact", maximumFractionDigits: 1 }
    : { maximumFractionDigits: 0 };
  return <span>${"" + Number(value).toLocaleString("en-US", opts)}</span>;
};

const Badge = ({ tone = "neutral", dot = false, children }) => (
  <span className={`badge ${tone} ${dot ? "dot" : ""}`}>{children}</span>
);

const StatusBadge = ({ status }) => {
  const s = STATUSES[status] || { label: status, tone: "neutral" };
  return <Badge tone={s.tone} dot>{s.label}</Badge>;
};

const Avatar = ({ initials, kind = "neutral", size = "" }) => (
  <span className={`avatar ${kind} ${size}`}>{initials}</span>
);

const PageHead = ({ eyebrow, title, subtitle, actions }) => (
  <div className="page-head">
    <div className="meta">
      {eyebrow && <span className="eyebrow">{eyebrow}</span>}
      <h1 className="h1">{title}</h1>
      {subtitle && <span className="muted">{subtitle}</span>}
    </div>
    {actions && <div className="actions">{actions}</div>}
  </div>
);

const Stepper = ({ steps, current }) => (
  <div className="stepper">
    {steps.map((s, i) => (
      <React.Fragment key={s}>
        <div className={`step ${i < current ? "done" : ""} ${i === current ? "active" : ""}`}>
          <div className="num">{i < current ? "✓" : i + 1}</div>
          <div className="lab">{s}</div>
        </div>
        {i < steps.length - 1 && <div className={`bar ${i < current ? "done" : ""}`} style={{flex:1, height:1.5, background: i < current ? "var(--success)" : "var(--line)"}} />}
      </React.Fragment>
    ))}
  </div>
);

const Field = ({ label, hint, children }) => (
  <div className="field">
    {label && <label>{label}</label>}
    {children}
    {hint && <span className="hint">{hint}</span>}
  </div>
);

const Toggle = ({ on, onChange }) => (
  <span className={`toggle ${on ? "on" : ""}`} onClick={() => onChange(!on)} />
);

const FitMeter = ({ score }) => {
  const tone = score >= 85 ? "success" : score >= 70 ? "warn" : "neutral";
  return (
    <div style={{display:"flex", alignItems:"center", gap:8}}>
      <div style={{
        width: 40, height: 6, background: "var(--line)", borderRadius: 999, overflow: "hidden"
      }}>
        <div style={{
          width: `${score}%`, height: "100%",
          background: tone === "success" ? "var(--success)" : tone === "warn" ? "var(--warn)" : "var(--ink-3)",
        }} />
      </div>
      <span style={{fontSize:12, fontWeight:600, color:"var(--ink-2)"}}>{score}</span>
    </div>
  );
};

const AppetiteDots = ({ level }) => (
  <span style={{display:"inline-flex", gap:3}}>
    {[1,2,3,4,5].map(i => (
      <span key={i} style={{
        width:6, height:6, borderRadius:"50%",
        background: i <= level ? "var(--ink)" : "var(--line-strong)",
      }} />
    ))}
  </span>
);

const SplitBar = ({ orbiter }) => (
  <div className="split-bar">
    <div className="a" style={{width: `${orbiter}%`}} />
    <div className="b" style={{width: `${100 - orbiter}%`}} />
  </div>
);

const EmptyState = ({ icon = "spark", title, body, action }) => (
  <div className="empty">
    <div style={{display:"inline-flex", padding:10, borderRadius:"50%", background:"var(--surface)", border:"1px solid var(--line)", marginBottom:10}}>
      <Icon name={icon} size={20} />
    </div>
    <div style={{fontWeight:600, color:"var(--ink)", marginBottom:4}}>{title}</div>
    {body && <div style={{fontSize:13, marginBottom:12}}>{body}</div>}
    {action}
  </div>
);

const Drawer = ({ open, onClose, children }) => {
  if (!open) return null;
  return (
    <React.Fragment>
      <div className="drawer-back" onClick={onClose} />
      <div className="drawer">{children}</div>
    </React.Fragment>
  );
};

Object.assign(window, {
  Money, Badge, StatusBadge, Avatar, PageHead, Stepper, Field, Toggle,
  FitMeter, AppetiteDots, SplitBar, EmptyState, Drawer,
});
</script>
<script type="text/babel">// Orbiter: Browse Planets and their Buy Boxes
const { Icon } = window;
const { Badge, FitMeter, AppetiteDots, PageHead } = window;
const { PLANETS } = window.ORBIT_DATA;

function BrowsePlanets({ onOpenPlanet, onSendLead }) {
  const [filter, setFilter] = React.useState("all");
  const [view, setView] = React.useState("grid");
  const [search, setSearch] = React.useState("");

  const filters = [
    { id: "all",       label: "All Planets" },
    { id: "sub-to",    label: "Sub-To" },
    { id: "seller",    label: "Seller Finance" },
    { id: "wrap",      label: "Wrap" },
    { id: "novation",  label: "Novation" },
    { id: "fast",      label: "Fast close (<14d)" },
  ];

  const filtered = PLANETS.filter(p => {
    const matchSearch = search === "" ||
      p.name.toLowerCase().includes(search.toLowerCase()) ||
      p.markets.some(m => m.toLowerCase().includes(search.toLowerCase()));
    if (!matchSearch) return false;
    if (filter === "all") return true;
    if (filter === "sub-to") return p.financing.includes("Sub-To");
    if (filter === "seller") return p.financing.includes("Seller Finance");
    if (filter === "wrap") return p.financing.includes("Wrap");
    if (filter === "novation") return p.financing.includes("Novation");
    if (filter === "fast") return p.closingSpeed.startsWith("7") || p.closingSpeed.startsWith("10");
    return true;
  });

  return (
    <div>
      <PageHead
        eyebrow="Marketplace"
        title="Browse Planets"
        subtitle="Find buyers whose buy box matches the seller you're talking to. Send the lead, JV the deal, get paid on close."
        actions={
          <React.Fragment>
            <button className="btn" onClick={() => setView(view === "grid" ? "map" : "grid")}>
              <Icon name={view === "grid" ? "map" : "kanban"} size={14}/>
              {view === "grid" ? "Map view" : "Grid view"}
            </button>
            <button className="btn primary" onClick={onSendLead}>
              <Icon name="send" size={14}/> New lead
            </button>
          </React.Fragment>
        }
      />

      {/* Filter bar */}
      <div style={{display:"flex", alignItems:"center", gap:14, marginBottom:18, flexWrap:"wrap"}}>
        <div className="search" style={{width:300}}>
          <Icon name="search" size={14}/>
          <input
            placeholder="Search by Planet, market, or operator…"
            value={search} onChange={e => setSearch(e.target.value)}
          />
        </div>
        <div className="chiprow">
          {filters.map(f => (
            <button key={f.id}
              className={`chip ${filter === f.id ? "active" : ""}`}
              onClick={() => setFilter(f.id)}>
              {f.label}
            </button>
          ))}
        </div>
        <div className="spacer"/>
        <span className="muted" style={{fontSize:12}}>{filtered.length} of {PLANETS.length} Planets</span>
      </div>

      {view === "map" ? (
        <MapView planets={filtered} onOpen={onOpenPlanet} />
      ) : (
        <div className="grid-cards">
          {filtered.map(p => (
            <PlanetCard key={p.id} planet={p} onClick={() => onOpenPlanet(p)} onSend={onSendLead}/>
          ))}
        </div>
      )}
    </div>
  );
}

function PlanetCard({ planet, onClick, onSend }) {
  return (
    <div className="bb-card" onClick={onClick} role="button">
      <div className={`bb-banner ${planet.banner}`}>
        <div className="planet-mark"/>
        <div style={{position:"absolute", top:10, right:10, display:"flex", gap:6}}>
          <Badge tone="outline">
            <Icon name="lightning" size={11}/>
            {planet.closingSpeed}
          </Badge>
        </div>
      </div>
      <div className="bb-card-body">
        <div style={{display:"flex", alignItems:"flex-end", justifyContent:"space-between"}}>
          <div>
            <div className="name">{planet.name}</div>
            <div className="where">{planet.markets.slice(0,2).join(" · ")}{planet.markets.length>2 ? ` +${planet.markets.length-2}` : ""}</div>
          </div>
          <AppetiteDots level={planet.appetite}/>
        </div>
        <div className="bb-criteria">
          <div className="bb-crit-row">
            <span className="lab">Types</span>
            <span className="val">{planet.propTypes.join(", ")}</span>
          </div>
          <div className="bb-crit-row">
            <span className="lab">Financing</span>
            <span className="val">{planet.financing.join(" · ")}</span>
          </div>
          <div className="bb-crit-row">
            <span className="lab">Price</span>
            <span className="val">{planet.pricing}</span>
          </div>
        </div>
      </div>
      <div className="bb-foot">
        <div className="stat-mini">
          <span className="v">{planet.leadsClosed}</span>
          <span className="l">Closed</span>
        </div>
        <div className="stat-mini">
          <span className="v">{planet.avgSplit}</span>
          <span className="l">Avg split</span>
        </div>
        <div className="stat-mini">
          <span className="v">{planet.avgResponse}</span>
          <span className="l">Reply</span>
        </div>
        <div className="spacer"/>
        <button className="btn sm primary" onClick={(e)=>{e.stopPropagation(); onSend(planet);}}>
          Send lead
        </button>
      </div>
    </div>
  );
}

function MapView({ planets, onOpen }) {
  const positions = [
    { left: "16%", top: "62%" },
    { left: "32%", top: "44%" },
    { left: "48%", top: "55%" },
    { left: "21%", top: "30%" },
    { left: "72%", top: "70%" },
    { left: "62%", top: "40%" },
  ];
  return (
    <div className="map" style={{height: 540}}>
      {planets.map((p, i) => (
        <div key={p.id} style={{position:"absolute", ...positions[i % positions.length]}}>
          <div className="pin" onClick={() => onOpen(p)} style={{cursor:"pointer"}}>
            <span>{p.initials}</span>
          </div>
          <div style={{
            position: "absolute", top: 8, left: -80, width: 200,
            background: "var(--surface)", border: "1px solid var(--line)",
            borderRadius: 10, padding: 10, boxShadow: "var(--shadow-sm)",
            fontSize: 12,
          }}>
            <div style={{fontWeight:600, marginBottom:2}}>{p.name}</div>
            <div className="muted" style={{fontSize:11}}>{p.markets[0]}</div>
            <div style={{display:"flex", gap:4, marginTop:6, flexWrap:"wrap"}}>
              {p.financing.slice(0,2).map(f => (
                <Badge key={f} tone="neutral">{f}</Badge>
              ))}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

window.BrowsePlanets = BrowsePlanets;
window.PlanetCard = PlanetCard;
</script>
<script type="text/babel">// Orbiter: Submit a new lead - multi-step wizard
const { Icon, Badge, Avatar, Money, Field, Stepper, FitMeter, SplitBar } = window;
const { PLANETS, STRUCTURES } = window.ORBIT_DATA;

function SubmitLead({ presetPlanet, onCancel, onSubmit }) {
  const [step, setStep] = React.useState(0);
  const [lead, setLead] = React.useState({
    address: "418 Camelback Ridge",
    city: "Phoenix",
    state: "AZ",
    zip: "85016",
    propType: "SFR",
    bedBath: "4 bd · 2 ba",
    sqft: "2140",
    yearBuilt: "1996",
    sellerName: "Robert Whitman",
    sellerPhone: "(602) 555-0184",
    sellerEmail: "rwhitman@example.com",
    motivation: "Inherited the property and relocating to Oregon for work. Doesn't want to manage it from out of state.",
    timeline: "60 days",
    askPrice: "412000",
    mortgageBalance: "268000",
    rate: "3.625",
    payment: "1640",
    arrearages: "0",
    structures: ["sub-to"],
    notes: "Owner is open to taking a chunk of cash up front and a monthly until the underlying is paid. Expressed interest in a 'novation' but didn't know the term.",
    targetPlanet: presetPlanet?.id || "p-aurora",
    proposedSplit: 65,
    callRecording: "seller-call-2026-04-30.mp3",
  });

  const set = (k, v) => setLead(prev => ({ ...prev, [k]: v }));

  const steps = ["Property", "Seller", "Financing", "Pick Planet", "Review"];

  const next = () => setStep(s => Math.min(s + 1, steps.length - 1));
  const back = () => setStep(s => Math.max(s - 1, 0));

  return (
    <div style={{maxWidth: 980, margin: "0 auto"}}>
      <button className="btn ghost sm" style={{marginBottom: 8}} onClick={onCancel}>
        <Icon name="back" size={14}/> Cancel & return
      </button>
      <PageHead
        eyebrow="New submission"
        title="Send a lead to a Planet"
        subtitle="The Planet will review fit, propose a JV split, and (if it's a yes) talk to the seller."
      />

      <div style={{marginBottom: 24, padding: "10px 18px", background: "var(--surface)", border: "1px solid var(--line)", borderRadius: "var(--radius)"}}>
        <Stepper steps={steps} current={step}/>
      </div>

      <div className="card" style={{marginBottom: 16}}>
        <div className="card-body">
          {step === 0 && <PropertyStep lead={lead} set={set}/>}
          {step === 1 && <SellerStep lead={lead} set={set}/>}
          {step === 2 && <FinancingStep lead={lead} set={set}/>}
          {step === 3 && <PickPlanetStep lead={lead} set={set}/>}
          {step === 4 && <ReviewStep lead={lead} set={set}/>}
        </div>
        <div className="card-foot">
          {step > 0 && <button className="btn" onClick={back}><Icon name="back" size={14}/> Back</button>}
          <div className="spacer"/>
          <span className="muted" style={{fontSize:12}}>Step {step+1} of {steps.length}</span>
          {step < steps.length - 1 ? (
            <button className="btn primary" onClick={next}>
              Continue <Icon name="arrow" size={14}/>
            </button>
          ) : (
            <button className="btn accent" onClick={() => onSubmit(lead)}>
              <Icon name="send" size={14}/> Send to Planet
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function PropertyStep({ lead, set }) {
  return (
    <div className="col" style={{gap: 16}}>
      <h2 className="h2">Property details</h2>
      <div className="grid-2">
        <Field label="Street address">
          <input className="input" value={lead.address} onChange={e=>set("address", e.target.value)}/>

        <Field label="Type">
          <select className="select" value={lead.propType} onChange={e=>set("propType", e.target.value)}>

      </Field>

}

function SellerStep({ lead, set }) {
  return (
    <div className="col" style={{gap: 16}}>
      <h2 className="h2">Seller & motivation</h2>

function FinancingStep({ lead, set }) {

            <span className="prefix">$</span>
            <input className="input with-prefix" value={lead.askPrice} onChange={e=>set("askPrice", e.target.value)}/>
          </div>

      </Field>

}

function PickPlanetStep({ lead, set }) {
  // score planets by overlap
  const scored = PLANETS.map(p => {
    let score = 50;
    if (p.markets.some(m => m.includes(lead.state))) score += 25;
    if (p.markets.some(m => m.toLowerCase().includes(lead.city.toLowerCase()))) score += 15;
    if (p.propTypes.includes(lead.propType)) score += 8;
    const structName = STRUCTURES.find(s => s.id === lead.structures[0])?.name;
    if (structName && p.financing.includes(structName === "Subject-To" ? "Sub-To" : structName === "Wrap-Around" ? "Wrap" : structName)) score += 10;
    score = Math.min(99, score);
    return { ...p, score };
  }).sort((a,b) => b.score - a.score);

  return (
    <div className="col" style={{gap: 16}}>
      <h2 className="h2">Pick a Planet</h2>
      <p className="muted" style={{margin:0}}>We've ranked your network by fit for this lead. The top match has the highest overlap on geography, property type, and financing structure.</p>
      <div className="col" style={{gap:8}}>
        {scored.slice(0, 5).map((p, i) => (
          <div key={p.id}
               className={`option-row ${lead.targetPlanet === p.id ? "active" : ""}`}
               onClick={() => set("targetPlanet", p.id)}
               style={{padding:"12px 14px"}}>
            <span className={`radio ${lead.targetPlanet === p.id ? "checked" : ""}`}/>
            <Avatar initials={p.initials} kind="planet"/>
            <div style={{display:"flex", flexDirection:"column", gap:2, flex:1, minWidth:0}}>
              <div style={{fontWeight:600}}>{p.name}{i === 0 && <Badge tone="success" style={{marginLeft:8}}>Top match</Badge>}</div>
              <div className="muted" style={{fontSize:12}}>
                {p.markets.join(" · ")} · {p.financing.join(", ")}
              </div>
            </div>
            <div style={{display:"flex", flexDirection:"column", alignItems:"flex-end", gap:4}}>
              <FitMeter score={p.score}/>
              <span className="muted" style={{fontSize:11}}>{p.avgSplit} avg split · replies {p.avgResponse}</span>
            </div>
          </div>
        ))}
      </div>

      <div className="divider"/>
      <Field label="Proposed JV split" hint="What you're asking the Planet to agree to. They can counter.">
        <div className="row" style={{gap:14}}>
          <input type="range" min="40" max="80" step="5"
            value={lead.proposedSplit}
            onChange={e => set("proposedSplit", parseInt(e.target.value))}
            style={{flex:1}}/>
          <div style={{minWidth: 200}}>
            <SplitBar orbiter={lead.proposedSplit}/>
            <div style={{display:"flex", justifyContent:"space-between", fontSize:11, marginTop:4}}>
              <span><span className="mono" style={{color:"var(--orbiter)"}}>●</span> You {lead.proposedSplit}%</span>
              <span><span className="mono" style={{color:"var(--planet)"}}>●</span> Planet {100 - lead.proposedSplit}%</span>
            </div>
          </div>
        </div>
      </Field>
    </div>
  );
}

function ReviewStep({ lead }) {
  const planet = PLANETS.find(p => p.id === lead.targetPlanet);
  const structures = lead.structures.map(s => STRUCTURES.find(x => x.id === s)?.name).filter(Boolean);
  return (
    <div className="col" style={{gap: 18}}>
      <h2 className="h2">Review & send</h2>
      <div className="grid-2" style={{gap: 18}}>
        <div className="card flat" style={{border:"1px solid var(--line)", padding:18}}>
          <div className="eyebrow" style={{marginBottom:10}}>Property</div>
          <div className="kv-grid">
            <span className="k">Address</span><span className="v">{lead.address}, {lead.city}, {lead.state} {lead.zip}</span>
            <span className="k">Type</span><span className="v">{lead.propType} · {lead.bedBath} · {lead.sqft} sqft · built {lead.yearBuilt}</span>
            <span className="k">Asking</span><span className="v"><Money value={parseInt(lead.askPrice)}/></span>
            <span className="k">Mortgage</span><span className="v"><Money value={parseInt(lead.mortgageBalance)}/> at {lead.rate}%</span>
            <span className="k">Payment</span><span className="v"><Money value={parseInt(lead.payment)}/>/mo</span>
          </div>
        </div>
        <div className="card flat" style={{border:"1px solid var(--line)", padding:18}}>
          <div className="eyebrow" style={{marginBottom:10}}>Seller</div>
          <div className="kv-grid">
            <span className="k">Name</span><span className="v">{lead.sellerName}</span>
            <span className="k">Contact</span><span className="v">{lead.sellerPhone} · {lead.sellerEmail}</span>
            <span className="k">Motivation</span><span className="v">{lead.motivation}</span>
            <span className="k">Timeline</span><span className="v">{lead.timeline}</span>
            <span className="k">Open to</span><span className="v">{structures.join(", ")}</span>

      <div className="card flat" style={{border:"1px solid var(--line)", padding:18}}>

        <div style={{display:"flex", alignItems:"center", gap:18}}>
          <Avatar initials={planet?.initials || "??"} kind="planet" size="lg"/>
          <div style={{flex:1}}>

            <div className="muted" style={{fontSize:12}}>{planet?.markets.join(" · ")}</div>

          <div style={{minWidth: 240}}>

            <div style={{display:"flex", justifyContent:"space-between", fontSize:12, marginTop:6}}>
              <span>You: <strong>{lead.proposedSplit}%</strong></span>
              <span>Planet: <strong>{100 - lead.proposedSplit}%</strong></span>
            </div>

        </div>

      <div style={{padding:14, background:"var(--accent-soft)", borderRadius:10, fontSize:13, display:"flex", gap:10}}>
        <Icon name="spark" size={16}/>

          <strong>Heads up:</strong> Once sent, {planet?.name} typically replies in {planet?.avgResponse}. You'll be notified when they review or message.
        </div>
      </div>

  );
}

</script>

function Timeline({ items }) {

<script type="text/babel">// Main app shell — sidebar, topbar, role + screen routing

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#2f5fe0",

  "showFitBadges": true
}/*EDITMODE-END*/;

function App() {
  const [role, setRole] = useState("orbiter");

    setTweaks(next);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: next }, "*");
  };

  // Apply accent tweak live
  React.useEffect(() => {
    document.documentElement.style.setProperty("--accent", tweaks.accent);
  }, [tweaks.accent]);

  const nav = role === "orbiter" ? NAV_ORBITER : role === "planet" ? NAV_PLANET : NAV_MOON;
  const here = nav.find(n => n.id === screen) || nav[0];

  const onJump = (id) => setScreen(id);
  const onOpenLead = (lead) => setDrawerLead(lead);
  const onSendLead = (planet) => { setSubmitPreset(planet || null); setScreen("submit"); };

  const switchRole = (r) => {
    setRole(r);
    if (!nav.find(n => n.id === screen)) setScreen("dashboard");
    setScreen("dashboard");

  return (
    <div className="app">

        <div className="brand">

          <button className={`${role === "moon" ? "active moon" : ""}`} onClick={() => switchRole("moon")}>Moon</button>

              {n.section && <div className="nav-label" style={{marginTop:8, fontSize:9, opacity:0.6}}>{n.section}</div>}
              <button
                className={`nav-item ${screen === n.id ? "active" : ""}`}
                onClick={() => setScreen(n.id)}>
                <Icon name={n.icon} size={14} stroke={1.6} style={{flex:"0 0 14px"}}/>
                <span>{n.label}</span>
                {n.count != null && <span className="nav-count">{n.count}</span>}
              </button>
            </React.Fragment>
          ))}

            <span className="name">{role === "orbiter" ? "Avery Quinn" : role === "planet" ? "Maya Okafor" : "Jordan Rivera"}</span>
            <span className="role">{role === "orbiter" ? "Orbit · Phoenix" : role === "planet" ? "Aurora Holdings" : "Moon · RV Parks / MF"}</span>
          </div>
        </div>
      </aside>

      <main className="main">
        <header className="topbar">
          <div className="crumb">
            <span>{role === "orbiter" ? "Orbit" : role === "planet" ? "Planet" : "Moon"}</span>
            <Icon name="arrow" size={11} stroke={2}/>
            <span className="here">{here.label}</span>
          </div>
          <div className="topbar-actions">
            <div className="search">
              <Icon name="search" size={14}/>
              <input placeholder={role === "orbiter" ? "Search Planets, leads, sellers…" : role === "planet" ? "Search leads, Orbits, addresses…" : "Search leads, Planets, sellers…"}/>
            </div>
            <button className="icon-btn"><Icon name="bell" size={15}/></button>
            <button className="icon-btn"><Icon name="settings" size={15}/></button>
          </div>
        </header>

        <div className="content">
          {screen === "dashboard" && <window.Dashboard role={role} onJump={onJump}/>}
          {screen === "browse"    && (role === "orbiter" || role === "moon") && <window.BrowsePlanets onOpenPlanet={() => onSendLead()} onSendLead={onSendLead}/>}
          {screen === "submit"    && (role === "orbiter" || role === "moon") && <window.SubmitLead presetPlanet={submitPreset} onCancel={() => setScreen("browse")} onSubmit={() => { setScreen("leads"); }}/>}
          {screen === "leads"     && (role === "orbiter" || role === "moon") && <window.MyLeads onOpenLead={onOpenLead} onNew={() => setScreen("submit")}/>}
          {screen === "inbox"     && (role === "planet"  || role === "moon") && <window.PlanetInbox onOpenLead={onOpenLead}/>}
          {screen === "pipeline"  && (role === "planet"  || role === "moon") && <window.Pipeline/>}
          {screen === "buybox"    && (role === "planet"  || role === "moon") && <window.BuyBoxManage/>}
          {screen === "messages"  && <window.Messaging/>}
          {screen === "jv"        && <window.JVAgreement/>}
        </div>
      </main>

      <Drawer open={!!drawerLead} onClose={() => setDrawerLead(null)}>
        <window.LeadDetail lead={drawerLead} role={role} onClose={() => setDrawerLead(null)} onMessage={() => { setDrawerLead(null); setScreen("messages"); }}/>
      </Drawer>

      {/* Tweaks */}
      
    </div>
  );
}

      </TweakSection>
      <TweakSection title="Density">

}

*/
