<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbit · Creative finance lead network</title>
<style>
  :root{
    --bg:#f6f3ec; --panel:#fffdf9; --panel2:#fbf8f1; --line:#e8e2d6; --line2:#efeadf;
    --ink:#1c1a17; --ink2:#57514a; --ink3:#8d857a;
    --rust:#b8502c; --rust-soft:#f3e2d8; --green:#3f6b4f; --green-soft:#e2ece4;
    --amber:#c9821f; --red:#bb4634; --blue:#3c5ccc;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(28,26,23,.04),0 4px 16px rgba(28,26,23,.04);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:inherit}
  .hidden{display:none !important}

  /* Layout */
  .app{display:flex;min-height:100vh}
  .sidebar{width:236px;flex:0 0 236px;background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 16px;position:sticky;top:0;height:100vh}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:16px;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
  .content{padding:28px 32px 60px;max-width:1280px;width:100%}

  /* Brand + role toggle */
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:21px;font-weight:600;margin-bottom:16px;padding-left:4px}
  .orb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#cfe0ff 0%,#6f86c9 34%,#2f3f7a 100%);box-shadow:inset -2px -3px 6px rgba(0,0,0,.35)}
  .role-toggle{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:24px}
  .role-toggle button{flex:1;border:0;background:transparent;color:var(--ink3);font-size:13px;font-weight:600;padding:7px 4px;border-radius:8px}
  .role-toggle button.active{background:var(--rust);color:#fff}

  .nav-label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:0 8px;margin-bottom:10px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--ink2);padding:9px 10px;border-radius:9px;font-size:14px;font-weight:500;text-align:left}
  .nav button:hover{background:var(--line2)}
  .nav button.active{background:var(--ink);color:#fff}
  .nav button .ico{width:17px;display:inline-flex;justify-content:center;opacity:.85}
  .nav .badge{margin-left:auto;background:var(--line);color:var(--ink2);border-radius:20px;font-size:11px;font-weight:700;padding:1px 8px}
  .nav button.active .badge{background:rgba(255,255,255,.22);color:#fff}

  .side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:9px}
  .side-foot:hover{background:var(--line2)}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--rust);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 34px}
  .side-foot .nm{font-weight:600;font-size:13.5px;line-height:1.2}
  .side-foot .sub{font-size:11.5px;color:var(--ink3)}

  /* Topbar */
  .crumbs{display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:13px}
  .crumbs b{color:var(--ink);font-weight:600}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:340px;color:var(--ink3)}
  .search input{border:0;background:transparent;outline:none;width:100%;color:var(--ink)}
  .icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
  .icon-btn:hover{background:var(--line2)}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:13.5px;padding:9px 15px}
  .btn:hover{background:var(--line2)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#000}
  .btn.rust{background:var(--rust);color:#fff;border-color:var(--rust)}
  .btn.rust:hover{filter:brightness(.95)}
  .btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .btn.ghostdanger{color:var(--red);border-color:#e9cdc6}
  .btn.ghostdanger:hover{background:#f7e7e2}

  .page-eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--rust);font-weight:700;margin-bottom:6px}
  .page-h{font-size:30px;margin-bottom:4px}
  .page-sub{color:var(--ink2);font-size:14.5px}
  .page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:24px}
  .page-head .grow{flex:1}

  /* Cards / grids */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .stat{padding:18px 20px}
  .stat .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
  .stat .val{font-family:var(--serif);font-size:32px;margin:8px 0 4px}
  .stat .delta{font-size:12.5px;color:var(--ink3)}
  .stat .delta.up{color:var(--green)}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line2)}
  .sec-head h3{font-size:17px}
  .link{color:var(--ink2);font-weight:600;font-size:13px;background:none;border:0;display:inline-flex;gap:6px;align-items:center}
  .link:hover{color:var(--ink)}

  .row-lead{display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line2);cursor:pointer}
  .row-lead:last-child{border-bottom:0}
  .row-lead:hover{background:var(--panel2)}
  .planet-dot{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 34px;background:var(--green)}
  .row-lead .ttl{font-weight:600}
  .row-lead .meta{font-size:12.5px;color:var(--ink3)}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .pill .d{width:7px;height:7px;border-radius:50%}
  .pill.amber{background:#f8eed8;color:#8a6312}.pill.amber .d{background:var(--amber)}
  .pill.green{background:var(--green-soft);color:#2c5238}.pill.green .d{background:var(--green)}
  .pill.red{background:#f6e0db;color:#963625}.pill.red .d{background:var(--red)}
  .pill.blue{background:#e2e7fb;color:#2b3f9e}.pill.blue .d{background:var(--blue)}
  .pill.gray{background:var(--line2);color:var(--ink2)}.pill.gray .d{background:var(--ink3)}

  .activity-item{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line2)}
  .activity-item:last-child{border-bottom:0}
  .act-ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 30px;font-size:13px}
  .act-ico.g{background:var(--green-soft);color:var(--green)}
  .act-ico.r{background:#f6e0db;color:var(--red)}
  .act-ico.b{background:#e2e7fb;color:var(--blue)}
  .act-ico.n{background:var(--rust-soft);color:var(--rust)}
  .act-ico.m{background:var(--line2);color:var(--ink2)}
  .act-txt{font-size:13.5px}.act-txt .t{color:var(--ink3);font-size:12px}

  /* Planet marketplace */
  .planet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .planet-card{padding:0;overflow:hidden;display:flex;flex-direction:column}
  .planet-hero{height:78px;position:relative;background:linear-gradient(120deg,#e7eef9,#f2e7f0,#f5ece2)}
  .planet-hero .orb-lg{position:absolute;left:20px;bottom:-22px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#d6efd9 0%,#7bb389 38%,#33694a 100%);box-shadow:inset -3px -4px 8px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.12)}
  .planet-hero .close-tag{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.78);border-radius:20px;font-size:11.5px;font-weight:700;padding:3px 9px;color:var(--ink2)}
  .planet-body{padding:30px 18px 16px}
  .planet-body h3{font-size:18px}
  .planet-body .loc{font-size:12.5px;color:var(--ink3);margin-bottom:12px}
  .kv{display:grid;grid-template-columns:74px 1fr;gap:4px 8px;font-size:13px;margin-bottom:6px}
  .kv .k{color:var(--ink3)}
  .planet-foot{display:flex;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--line2)}
  .planet-foot .m{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .planet-foot .mv{font-family:var(--serif);font-size:16px;color:var(--ink)}
  .planet-foot .btn{margin-left:auto}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink2)}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tag{display:inline-block;background:var(--line2);color:var(--ink2);border-radius:7px;font-size:12px;font-weight:600;padding:3px 9px;margin:0 4px 4px 0}

  /* Table (My leads) */
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line2)}
  tbody td{padding:14px 16px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--panel2)}
  .split-bar{height:7px;border-radius:6px;background:var(--green);overflow:hidden;width:108px;display:flex}
  .split-bar .you{background:var(--rust);height:100%}
  .split-cap{font-size:11.5px;color:var(--ink3);margin-top:4px}

  /* Wizard */
  .steps{display:flex;align-items:center;gap:0;margin-bottom:22px}
  .step{display:flex;align-items:center;gap:9px;color:var(--ink3);font-size:13.5px;font-weight:600}
  .step .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--panel)}
  .step.active{color:var(--ink)}
  .step.active .n{background:var(--ink);color:#fff;border-color:var(--ink)}
  .step.done .n{background:var(--green);color:#fff;border-color:var(--green)}
  .step-line{flex:1;height:1.5px;background:var(--line);margin:0 12px;min-width:24px}
  .form-card{padding:22px}
  .form-grid{display:grid;gap:14px 16px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel2);outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rust);background:#fff}
  .form-foot{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-top:1px solid var(--line2)}
  .form-foot .stepcap{color:var(--ink3);font-size:13px}

  /* Messages */
  .msg-wrap{display:grid;grid-template-columns:300px 1fr 300px;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel);min-height:560px}
  .thread-list{border-right:1px solid var(--line2);display:flex;flex-direction:column}
  .thread-search{padding:14px}
  .thread-search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--panel2);outline:none}
  .thread{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
  .thread:hover,.thread.active{background:var(--panel2)}
  .thread.active{box-shadow:inset 3px 0 0 var(--ink)}
  .thread .nm{font-weight:600;font-size:13.5px}
  .thread .pv{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
  .thread .lid{font-size:11px;color:var(--ink3);margin-top:3px}
  .chat{display:flex;flex-direction:column}
  .chat-head{display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid var(--line2)}
  .chat-body{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:430px}
  .bubble{max-width:74%;padding:10px 14px;border-radius:14px;font-size:13.5px}
  .bubble.them{background:var(--panel2);border:1px solid var(--line2);align-self:flex-start;border-bottom-left-radius:4px}
  .bubble.you{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .bubble .ts{font-size:10.5px;opacity:.6;margin-top:4px}
  .chat-input{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line2)}
  .chat-input input{flex:1;border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--panel2);outline:none}
  .ctx{border-left:1px solid var(--line2);padding:18px}
  .ctx-img{height:120px;border-radius:10px;background:repeating-linear-gradient(45deg,#efeadf,#efeadf 9px,#f5f1e9 9px,#f5f1e9 18px);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:12px;margin-bottom:14px}

  /* JV */
  .jv-doc{padding:24px;font-size:13.5px;line-height:1.7;max-height:560px;overflow-y:auto}
  .jv-doc h3{font-size:20px;margin-bottom:4px}
  .jv-doc .eff{color:var(--ink3);margin-bottom:16px}
  .jv-doc p{margin:0 0 13px}
  .sign-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line2)}
  .sign-row .btn{margin-left:auto}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(28,26,23,.42);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:100;overflow-y:auto}
  .modal{background:var(--panel);border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line2)}
  .modal-head h3{font-size:19px}
  .modal-body{padding:22px;max-height:64vh;overflow-y:auto}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line2)}
  .x{border:0;background:transparent;font-size:22px;color:var(--ink3);line-height:1;cursor:pointer}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:11px;font-weight:600;font-size:13.5px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  .empty{text-align:center;color:var(--ink3);padding:60px 20px}
  .empty .big{font-family:var(--serif);font-size:20px;color:var(--ink2);margin-bottom:6px}

  .soon{display:inline-block;background:var(--rust-soft);color:var(--rust);font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;margin-left:8px;vertical-align:middle}

  @media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.msg-wrap{grid-template-columns:1fr}.ctx,.thread-list{border:0;border-top:1px solid var(--line2)}}
  @media(max-width:720px){.sidebar{display:none}.search{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ORBIT — Creative finance lead network (personal edition)
   All data lives in your browser (localStorage). Nothing is
   sent anywhere. Use Settings → Export to back up.
   ============================================================ */

const KEY = "orbit_state_v1";

/* ---------- Cloud sync (Google Sheets via Apps Script) ----------
   The app works fully offline on localStorage. If you connect a
   Google Sheet backend (Settings → Cloud sync), it also syncs to
   the cloud so your deals follow you across devices. */
const CONFIG = { apiUrl: "" };           // optional: hard-code your /exec URL here
const API_KEY = "orbit_api_url";          // localStorage override for the backend URL
const AUTH_KEY = "orbit_pass";            // your passcode (kept only in this browser)
let syncStatus = "local";                 // local | syncing | synced | error | offline
function getApiUrl(){ return (localStorage.getItem(API_KEY)||CONFIG.apiUrl||"").trim(); }
function getPass(){ return localStorage.getItem(AUTH_KEY)||""; }
function cloudOn(){ return !!getApiUrl(); }

function jsonp(url){
  return new Promise((res,rej)=>{
    const cb="orbcb_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    window[cb]=d=>{res(d);try{delete window[cb];}catch(e){}s.remove();};
    s.onerror=()=>{s.remove();try{delete window[cb];}catch(e){}rej(new Error("network"));};
    s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;
    document.body.appendChild(s);
    setTimeout(()=>{if(window[cb]){try{delete window[cb];}catch(e){}s.remove();rej(new Error("timeout"));}},14000);
  });
}
async function apiPing(pass){
  const r=await jsonp(getApiUrl()+"?action=ping&pass="+encodeURIComponent(pass));
  if(r.ok) return true;
  throw new Error(r.error||"unauthorized");
}
async function apiLoad(){
  const r=await jsonp(getApiUrl()+"?action=load&pass="+encodeURIComponent(getPass()));
  if(!r.ok) throw new Error(r.error||"load-failed");
  return r.state;
}
async function apiSave(st){
  const body=JSON.stringify({action:"save",pass:getPass(),state:st});
  const url=getApiUrl();
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
    try{const j=await r.json();if(j&&j.ok===false&&j.error==="unauthorized")throw {auth:true};}catch(e){if(e&&e.auth)throw e;}
    return true;
  }catch(e){
    if(e&&e.auth)throw new Error("unauthorized");
    // Cross-origin read may be blocked even though the write went through — fire-and-forget.
    try{await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body});return true;}
    catch(_){throw new Error("network");}
  }
}
let _saveTimer=null;
function scheduleCloudSave(){
  if(!cloudOn()||!getPass())return;
  syncStatus="syncing";updateSyncChip();
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async()=>{
    try{await apiSave(state);syncStatus="synced";}
    catch(e){syncStatus=(""+e.message).includes("unauthorized")?"error":"offline";}
    updateSyncChip();
  },900);
}
function updateSyncChip(){const el=document.getElementById("syncChip");if(el)el.outerHTML=syncChip();}
function syncChip(){
  if(!cloudOn())return `<button class="icon-btn" id="syncChip" data-go="settings" title="Not synced — connect a backend">☁</button>`;
  const map={syncing:["⟳","var(--amber)","Syncing…"],synced:["☁✓","var(--green)","Synced to your Sheet"],error:["☁!","var(--red)","Login needed"],offline:["☁…","var(--ink3)","Offline — will retry"],local:["☁","var(--ink3)","Connected"]};
  const[ic,col,tip]=map[syncStatus]||map.local;
  return `<button class="icon-btn" id="syncChip" data-go="settings" title="${tip}" style="color:${col}">${ic}</button>`;
}

const STATUSES = ["New","Under review","Countered","Seller talks","JV signed","Closed","Declined"];
const STATUS_PILL = {
  "New":"gray","Under review":"amber","Countered":"amber","Seller talks":"blue",
  "JV signed":"green","Closed":"green","Declined":"red"
};
const STRUCTURES = ["Sub-To","Seller Finance","Wrap","Novation","Lease Option","Hybrid"];

/* ---------- Seed data (your starter set — edit or clear anytime) ---------- */
function seed(){
  return {
    profile:{ name:"Phil", org:"P.A.T.H. Operating Co.", market:"Phoenix, AZ", role:"Orbit", initials:"P" },
    counters:{ lead: 2042 },

let state;

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw);}catch(e){}
  const s=seed();save(s);return s;
}
function saveLocal(s){state=s||state;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function save(s){saveLocal(s);scheduleCloudSave();}

/* Boot: show local cache instantly, then pull from the cloud if connected. */
async function boot(){
  state=load();
  render();
  if(cloudOn()){
    if(!getPass()){showLogin();return;}
    await cloudSync();
  }
}
async function cloudSync(){
  syncStatus="syncing";updateSyncChip();
  try{
    const remote=await apiLoad();
    if(remote&&remote.profile){state=remote;saveLocal();}
    else{await apiSave(state);}      // empty sheet → seed it with what's here
    syncStatus="synced";render();
  }catch(e){
    const m=""+e.message;
    if(m.includes("unauthorized")){localStorage.removeItem(AUTH_KEY);syncStatus="error";showLogin();return;}
    if(m.includes("no-passcode-set")){syncStatus="error";toast("Finish the Google setup: set your passcode in Apps Script");render();return;}
    syncStatus="offline";render();
  }
}

/* Fit score: how well a lead matches a planet's buy box (0-100) */
function fitScore(lead,planet){
  if(!planet) return 0;
  let s=0;
  // structure match (35)
  s+= planet.financing.includes(lead.structure)?35:8;
  // type match (25)
  const t=lead.propType;
  const typeHit = planet.types.some(pt=>pt.toLowerCase().includes(t.toLowerCase())|| t.toLowerCase().includes(pt.toLowerCase().split(" ")[0]));
  s+= typeHit?25:6;
  // price in range (25)
  const price=Number(lead.asking)||0;
  if(price>=planet.priceMin&&price<=planet.priceMax) s+=25;
  else { const span=planet.priceMax-planet.priceMin||1; const off=Math.min(Math.abs(price-planet.priceMin),Math.abs(price-planet.priceMax))/span; s+=Math.max(0,15-off*15);}
  // market match (15)
  s+= planet.markets.some(m=>m.split(",")[1] && lead.state && m.toLowerCase().includes((lead.state||"").toLowerCase())) ? 15 : 6;
  return Math.round(Math.max(0,Math.min(100,s)));
}
function avgFit(){
  const active=state.leads.filter(l=>!["Closed","Declined"].includes(l.status));
  if(!active.length) return 0;
  return Math.round(active.reduce((a,l)=>a+fitScore(l,planetById(l.planetId)),0)/active.length);
}
function payoutEst(lead){
  if(lead.payout) return lead.payout;
  return Math.round((Number(lead.estProfit)||0)*(Number(lead.splitYou)||0)/100);
}

function F(label,name,val,type){return `<div class="field"><label>${label}</label><input name="${name}" type="${type||'text'}" value="${esc(val??"")}"/></div>`;}
function SEL(label,name,val,opts){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join("")}</select></div>`;}
function rev(k,v){return `<div class="card" style="padding:12px 14px"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700">${k}</div><div style="margin-top:4px">${v}</div></div>`;}

function wireSubmit(){
  const w=route.wizard; if(!w) return;
  function grab(){document.querySelectorAll("#content [name]").forEach(el=>{let v=el.type==="number"?(el.value===""?"":Number(el.value)):el.value;if(el.name==="freeClear")v=el.value==="true";if(el.type==="radio"){if(el.checked)w.data[el.name]=el.value;}else w.data[el.name]=v;});}
  const nx=$("[data-wnext]"),pv=$("[data-wprev]"),sb=$("[data-wsubmit]");
  if(nx)nx.onclick=()=>{grab();if(w.step===1&&!w.data.address){toast("Add a street address first");return;}w.step++;render();};
  if(pv)pv.onclick=()=>{grab();w.step--;render();};
  document.querySelectorAll("[name=planetId]").forEach(r=>r.onclick=()=>{grab();render();});
  if(sb)sb.onclick=()=>{grab();submitLead(w.data);};
}
function submitLead(d){
  if(!d.planetId){toast("Choose a Planet to send to");return;}
  const pl=planetById(d.planetId);
  const id=nextLeadId();
  const lead={
    id,address:d.address||"Untitled lead",city:d.city||"",state:d.state||"",zip:d.zip||"",
    propType:d.propType||"SFR",beds:d.beds||"",baths:d.baths||"",sqft:d.sqft||"",year:d.year||"",
    sellerName:d.sellerName||"",sellerPhone:d.sellerPhone||"",motivation:d.motivation||"",
    structure:d.structure||"Sub-To",planetId:d.planetId,
    asking:Number(d.asking)||0,balance:d.freeClear?0:Number(d.balance)||0,freeClear:!!d.freeClear,
    splitYou:Number(d.splitYou)||65,splitThem:100-(Number(d.splitYou)||65),
    status:"Under review",estProfit:Number(d.estProfit)||0,rate:d.rate||"",
    createdAt:new Date().toISOString(),lastUpdate:"Just sent · awaiting "+(pl?pl.name:"Planet")
  };
  state.leads.unshift(lead);
  state.threads.unshift({id:"t"+Date.now(),leadId:id,planetId:d.planetId,contact:pl?pl.contact:"Planet",msgs:[]});
  state.activity.unshift({ico:"n",bold:"You",text:` sent ${id} to ${pl?pl.name:"a Planet"}`,time:"just now"});
  save();route={};view="leads";render();toast(`Lead ${id} sent to ${pl?pl.name:"Planet"} ✓`);
}

function wireMessages(){
  document.querySelectorAll("[data-thread]").forEach(t=>t.onclick=()=>{route.thread=t.dataset.thread;render();});
  const send=$("#msgSend"),input=$("#msgInput");
  function doSend(){
    const v=input.value.trim();if(!v)return;
    const id=route.thread||state.threads[0].id;
    const t=state.threads.find(x=>x.id===id);
    t.msgs.push({from:"you",text:v,time:nowTime()});
    const lead=state.leads.find(l=>l.id===t.leadId);if(lead)lead.lastUpdate="You replied just now";
    save();render();setTimeout(()=>{const b=$("#chatBody");if(b)b.scrollTop=b.scrollHeight;},0);
  }
  if(send)send.onclick=doSend;
  if(input)input.onkeydown=e=>{if(e.key==="Enter")doSend();};
  const b=$("#chatBody");if(b)b.scrollTop=b.scrollHeight;
}
function nowTime(){return new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});}

      <p style="color:var(--ink2);margin:0 0 14px">Connect the Google Sheet backend so your deals sync across devices. Paste the Web app URL from your Apps Script deployment (ends in <code>/exec</code>) and your passcode. See <b>orbit-backend.gs</b> for setup.</p>
      <div class="field" style="margin-bottom:12px"><label>Apps Script Web app URL</label><input id="cs_url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(getApiUrl())}"/></div>
      <div class="field" style="max-width:280px"><label>Passcode</label><input id="cs_pass" type="password" placeholder="${getPass()?'•••••• (saved)':'Your passcode'}"/></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
        <button class="btn primary" id="cs_connect">Connect &amp; sync</button>
        <button class="btn" id="cs_now" ${cloudOn()&&getPass()?'':'disabled style="opacity:.5"'}>↻ Sync now</button>
        <button class="btn ghostdanger" id="cs_logout" ${cloudOn()&&getPass()?'':'disabled style="opacity:.5"'}>Log out this device</button>
      </div>
      <div id="cs_msg" style="font-size:13px;color:var(--ink2);margin-top:12px"></div>
    </div>
  </div>`;
}

/* ============================================================
   GLOBAL CLICK HANDLERS (delegation for dynamic buttons)
   ============================================================ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-pf],[data-lf],[data-sendto],[data-addplanet],[data-sign],[data-jvdownload]");
  if(!t)return;
  if(t.dataset.pf!==undefined){route.planetFilter=t.dataset.pf;render();}
  else if(t.dataset.lf!==undefined){route.leadFilter=t.dataset.lf;render();}
  else if(t.dataset.sendto!==undefined){startSendTo(t.dataset.sendto);}
  else if(t.dataset.addplanet!==undefined){openPlanetModal();}
  else if(t.dataset.sign!==undefined){signJV(t.dataset.sign);}
  else if(t.dataset.jvdownload!==undefined){downloadJV();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="planetQ"){route.planetQuery=e.target.value;const v=e.target.value;renderView();const inp=$("#planetQ");if(inp){inp.focus();inp.value=v;inp.setSelectionRange(v.length,v.length);}}
});
document.addEventListener("change",e=>{
  if(e.target.id==="jvPick"){route.jvLead=e.target.value;render();}
  if(e.target.id==="importData")handleImport(e.target.files[0]);
});

/* Settings actions (delegated by id, bound after render) */
function bindSettings(){}
document.addEventListener("click",e=>{
  if(e.target.id==="saveProfile"){
    state.profile.name=$("[name=s_name]").value||"You";
    state.profile.surname=$("[name=s_surname]").value||"";
    state.profile.org=$("[name=s_org]").value||"";
    state.profile.market=$("[name=s_market]").value||"";
    state.profile.initials=initials((state.profile.name+" "+state.profile.surname).trim());
    save();render();toast("Profile saved ✓");
  }
  if(e.target.id==="cs_connect")cloudConnect();
  if(e.target.id==="cs_now"){const m=$("#cs_msg");if(m)m.textContent="Syncing…";cloudSync().then(()=>{const mm=$("#cs_msg");if(mm)mm.textContent=syncStatus==="synced"?"Synced ✓":"Couldn't sync — check URL/passcode.";});}
  if(e.target.id==="cs_logout"){localStorage.removeItem(AUTH_KEY);syncStatus="local";toast("Logged out on this device");render();}
  if(e.target.id==="exportData")exportData();
  if(e.target.id==="clearData"){if(confirm("Clear ALL leads, Planets, and messages? This can't be undone (export first if unsure).")){state={...seed(),leads:[],threads:[],activity:[],planets:state.planets};state.profile=seed().profile;localStorage.setItem(KEY,JSON.stringify(state));view="dashboard";render();toast("Cleared — add your first lead");}}
  if(e.target.id==="resetData"){if(confirm("Reset everything back to the demo dataset?")){localStorage.removeItem(KEY);state=load();view="dashboard";render();toast("Reset to demo data");}}
});

/* ---------- Lead detail modal ---------- */
function openLead(id){
  const l=state.leads.find(x=>x.id===id);if(!l)return;
  const pl=planetById(l.planetId);
  modal(`${esc(l.address)} <span style="font-size:13px;color:var(--ink3);font-weight:400">· ${esc(l.id)}</span>`,`
    <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      ${rev("Location",`${esc(l.city)}, ${esc(l.state)} ${esc(l.zip)}`)}
      ${rev("Type / size",`${esc(l.propType)} · ${esc(l.beds||"?")}bd/${esc(l.baths||"?")}ba`)}
      ${rev("Seller",esc(l.sellerName||"—")+(l.sellerPhone?` · ${esc(l.sellerPhone)}`:""))}
      ${rev("Motivation",esc(l.motivation||"—"))}
    </div>
    <div class="field" style="margin-bottom:12px"><label>Planet (buyer)</label>
      <select id="ed_planet">${state.planets.map(p=>`<option value="${p.id}" ${p.id===l.planetId?'selected':''}>${esc(p.name)}</option>`).join("")}</select></div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;gap:12px">
      <div class="field"><label>Structure</label><select id="ed_structure">${STRUCTURES.map(s=>`<option ${s===l.structure?'selected':''}>${s}</option>`).join("")}</select></div>
      <div class="field"><label>Status</label><select id="ed_status">${STATUSES.map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join("")}</select></div>
      <div class="field"><label>Your split %</label><input id="ed_split" type="number" value="${l.splitYou}"/></div>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px">
      <div class="field"><label>Asking</label><input id="ed_asking" type="number" value="${l.asking}"/></div>
      <div class="field"><label>Balance</label><input id="ed_balance" type="number" value="${l.balance}"/></div>
      <div class="field"><label>Est. profit</label><input id="ed_profit" type="number" value="${l.estProfit}"/></div>
    </div>
    <div class="field" style="margin-top:12px"><label>Last update note</label><input id="ed_note" value="${esc(l.lastUpdate||"")}"/></div>
    <div style="margin-top:14px;padding:12px 14px;background:var(--panel2);border-radius:10px;font-size:13px">
      Fit to ${esc(pl?pl.name:"Planet")}: <b>${fitScore(l,pl)}</b> · Your est. payout: <b style="color:var(--green)">${money(payoutEst(l))}</b>
    </div>`,
    [
      {label:"Delete",cls:"ghostdanger",act:()=>{if(confirm("Delete this lead?")){state.leads=state.leads.filter(x=>x.id!==id);state.threads=state.threads.filter(t=>t.leadId!==id);save();closeModal();render();toast("Lead deleted");}}},
      {label:"Open JV",cls:"",act:()=>{closeModal();route.jvLead=id;view="jv";render();}},
      {label:"Save changes",cls:"primary",act:()=>{
        l.planetId=$("#ed_planet").value;l.structure=$("#ed_structure").value;
        const newStatus=$("#ed_status").value;
        l.splitYou=Number($("#ed_split").value)||l.splitYou;l.splitThem=100-l.splitYou;
        l.asking=Number($("#ed_asking").value)||0;l.balance=Number($("#ed_balance").value)||0;l.freeClear=l.balance===0;
        l.estProfit=Number($("#ed_profit").value)||0;l.lastUpdate=$("#ed_note").value;
        if(newStatus!==l.status){
          l.status=newStatus;
          if(newStatus==="Closed"){l.closedAt=new Date().toISOString();l.payout=payoutEst(l);state.activity.unshift({ico:"b",bold:"You",text:` closed ${l.id} — ${money(l.payout)} split`,time:"just now"});}
          if(newStatus==="JV signed"){l.signedYou=true;}
        }
        save();closeModal();render();toast("Lead updated ✓");
      }}
    ]);
}

/* ---------- Send-to (from a Planet card) ---------- */
function startSendTo(planetId){
  route.wizard={step:1,data:{propType:"SFR",freeClear:false,structure:"Sub-To",splitYou:65,splitThem:35,planetId}};
  view="submit";render();toast("New lead — it'll go to "+(planetById(planetId)?.name||"this Planet"));
}

/* ---------- Add Planet modal ---------- */
function openPlanetModal(){
  modal("Add a Planet (buyer)",`
    <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:12px">
      ${F("Planet name","p_name","")}${F("Operator / contact","p_contact","")}
    </div>
    <div class="field" style="margin-top:12px"><label>Markets (comma separated)</label><input id="p_markets" placeholder="Phoenix, AZ · Tucson, AZ"/></div>
    <div class="field" style="margin-top:12px"><label>Property types</label><input id="p_types" placeholder="SFR, Small Multi (2-4)"/></div>

      ${F("Min price","p_min","","number")}${F("Max price","p_max","","number")}${F("Your split %","p_split","65","number")}

        const splitYou=Number($("[name=p_split]").value)||65;

          name,contact:$("[name=p_contact]").value||"—",
          markets:($("#p_markets").value||"").split(/[·,]/).map(s=>s.trim()).filter(Boolean),
          types:($("#p_types").value||"SFR").split(",").map(s=>s.trim()).filter(Boolean),
          financing:($("#p_fin").value||"Sub-To").split(",").map(s=>s.trim()).filter(Boolean),
          priceMin:Number($("[name=p_min]").value)||0,priceMax:Number($("[name=p_max]").value)||1000000,
          closed:0,splitYou,splitThem:100-splitYou,replyHrs:"—",accept:0,closeDays:"—",note:""});
        save();closeModal();render();toast("Planet added ✓");
     }}]);
}

/* ---------- JV sign + download ---------- */
function signJV(who){
  const leadId=route.jvLead||(state.leads[0]||{}).id;const l=state.leads.find(x=>x.id===leadId);if(!l)return;
  if(who==="you")l.signedYou=!l.signedYou;
  if(who==="them")l.signedThem=!l.signedThem;
  if(l.signedYou&&l.signedThem&&l.status!=="Closed"){l.status="JV signed";l.lastUpdate="JV fully signed";state.activity.unshift({ico:"g",bold:"JV signed",text:` on ${l.id}`,time:"just now"});}
  save();render();toast(who==="you"?"You signed ✓":"Marked Planet signed");
}
function downloadJV(){
  const leadId=route.jvLead||(state.leads[0]||{}).id;const l=state.leads.find(x=>x.id===leadId);if(!l)return;
  const pl=planetById(l.planetId);
  const txt=`SINGLE-DEAL JV AGREEMENT — ${l.id}
Effective on full execution by both parties

PARTIES. "Orbiter" is ${state.profile.name} ${state.profile.surname||""} (${state.profile.org}). "Planet" is ${pl?pl.name:"the Planet"}${pl?`, operated by ${pl.contact}`:""}.

1. SUBJECT PROPERTY. ${l.address}, ${l.city}, ${l.state} ${l.zip}, owned by ${l.sellerName||"the Seller"}.
2. STRUCTURE. ${l.structure}${l.freeClear?" (free & clear)":`, existing financing left in place${l.rate?` at ${l.rate}`:""}${l.balance?`, ~${money(l.balance)} balance`:""}`}.
3. ROLES. Orbiter originated the lead and seller comms. Planet handles underwriting, contracts, diligence, closing, post-close.
4. COMPENSATION SPLIT. Net profit split ${l.splitYou}% Orbiter / ${l.splitThem}% Planet.
5. EXPENSES. Planet bears transaction costs; deducted from gross before the split.
6. CONFIDENTIALITY. Seller details used only to close this property.

Plain-language working draft, not legal advice. Have counsel review before signing.

Orbiter: ${state.profile.name} ${state.profile.surname||""}  ____________________   Date: __________
Planet:  ${pl?pl.contact:""} (${pl?pl.name:""})  ____________________   Date: __________`;
  const blob=new Blob([txt],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`JV_${l.id}.txt`;a.click();toast("JV downloaded");
}

/* ---------- Cloud connect ---------- */
async function cloudConnect(){
  const url=($("#cs_url").value||"").trim();
  const pass=($("#cs_pass").value||"").trim()||getPass();
  const msg=$("#cs_msg");
  if(!url){if(msg)msg.textContent="Paste your Apps Script Web app URL first.";return;}
  if(!/\/exec$/.test(url)){if(msg)msg.textContent="That URL should end in /exec — re-copy it from your Web app deployment.";return;}
  if(!pass){if(msg)msg.textContent="Enter your passcode.";return;}
  if(msg)msg.textContent="Connecting…";
  localStorage.setItem(API_KEY,url);
  try{
    await apiPing(pass);
    localStorage.setItem(AUTH_KEY,pass);
    await cloudSync();
    toast("Connected — your Sheet is synced ✓");render();
  }catch(e){
    const m=""+e.message;
    if(msg)msg.textContent=m.includes("no-passcode-set")?"Backend reached, but no passcode is set yet. Run SETUP_setPasscode in Apps Script.":m.includes("unauthorized")?"Wrong passcode for this Sheet.":"Couldn't reach that URL. Confirm the Web app is deployed to “Anyone”.";
  }
}

/* ---------- Export / import ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`orbit-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();toast("Backup downloaded ✓");
}
function handleImport(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.profile||!data.leads){toast("That doesn't look like an Orbit backup");return;}state=data;save();view="dashboard";render();toast("Backup imported ✓");}catch(e){toast("Couldn't read that file");}};
  r.readAsText(file);
}

/* ---------- Modal infra ---------- */
function modal(title,body,actions){
  const root=$("#modal-root");
  root.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal">
    <div class="modal-head"><h3>${title}</h3><button class="x" id="mx">×</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${actions.map((a,i)=>`<button class="btn ${a.cls}" data-mact="${i}">${a.label}</button>`).join("")}</div>
  </div></div>`;
  $("#mx").onclick=closeModal;
  $("#mbg").onclick=e=>{if(e.target.id==="mbg")closeModal();};
  actions.forEach((a,i)=>{root.querySelector(`[data-mact="${i}"]`).onclick=a.act;});
}
function closeModal(){$("#modal-root").innerHTML="";}

/* ---------- Login overlay (passcode for cloud sync) ---------- */
function showLogin(){
  document.getElementById("modal-root").innerHTML=`<div class="modal-bg"><div class="modal" style="max-width:420px">
    <div class="modal-head"><h3>Unlock Orbit</h3></div>
    <div class="modal-body">
      <p style="color:var(--ink2);margin:0 0 16px">Your deals are synced to your private Google Sheet. Enter your passcode to load them on this device.</p>
      <div class="field"><label>Passcode</label><input id="loginPass" type="password" placeholder="Your Orbit passcode" autofocus/></div>
      <div id="loginErr" style="color:var(--red);font-size:13px;margin-top:8px"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="loginOffline">Work offline</button>
      <button class="btn primary" id="loginGo">Unlock</button>
    </div>
  </div></div>`;
  const pass=document.getElementById("loginPass");
  const err=document.getElementById("loginErr");
  async function go(){
    const v=pass.value.trim();if(!v){err.textContent="Enter your passcode";return;}
    err.textContent="Checking…";
    try{await apiPing(v);localStorage.setItem(AUTH_KEY,v);closeModal();await cloudSync();toast("Unlocked — synced ✓");}
    catch(e){const m=""+e.message;err.textContent=m.includes("no-passcode-set")?"Backend has no passcode set yet — finish the Apps Script setup.":m.includes("unauthorized")?"Wrong passcode.":"Couldn't reach your Sheet. Check the URL in Settings.";}
  }
  document.getElementById("loginGo").onclick=go;
  pass.onkeydown=e=>{if(e.key==="Enter")go();};
  document.getElementById("loginOffline").onclick=()=>{closeModal();syncStatus="offline";render();toast("Working offline — changes stay on this device");};
}

/* ---------- boot ---------- */
boot();
</script>
